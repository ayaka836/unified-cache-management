reports:
  base_dir: "results/reports"
  use_timestamp: true
  directory_prefix: "pytest"
  html: # pytest-html
    enabled: true
    filename: "report.html"
    title: "UCM Pytest Test Report"

database:
  backup: "results/"
  enabled: false
  host: "127.0.0.1"
  port: 5432
  name: "ucm_test"
  user: "postgres"
  password: "123456"

models:
  ip_ports: "0.0.0.0:10035"
  tokenizer_path: "/home/models/Qwen3-32B"
  served_model_name: "vllm_cpu_offload"
  payload: '{"temperature":0, "max_tokens":1024, "ignore_eos":false}'
  enable_clear_hbm: false
  max_seq_length: 18500

llm_connection:
 model: "default"
 server_url: "http://localhost:18081"
 tokenizer_path: "/home/models/QwQ-32B"
 stream: true
 ignore_eos: true
 timeout: 180
 extra_info: "vllm_qwen3-32b_pc-gsa" 

# Environment Pre-Check Configuration
Env_preCheck:
  master_ip: 192.168.0.1
  worker_ip:
  ascend_rt_visible_devices: ""
  node_num:
  model_path: ""
  hf_model_name: ""
  middle_page: ""
  expected_embed_bandwidth: 10
  expected_fetch_bandwidth: 10
  kvCache_block_number: 1024
  storage_backends: [""]